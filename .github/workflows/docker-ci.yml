name: Docker Image CI Pipeline - UI Service

on:
  push:
    branches: [ main, master, dev, int ]
  pull_request:
    branches: [ main, master, dev, int ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, int, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - int
          - prod

env:
  ACR_NAME: rakeshacr01
  SERVICE_NAME: axion-ui
  AZURE_CLIENT_ID: "a74bb5f1-70ab-4e43-804f-911563937a5b"
  AZURE_TENANT_ID: "cf95a022-f760-4c81-b527-b8d8a9caddc2"
  AZURE_SUBSCRIPTION_ID: "a60bfb4b-160f-44e7-979b-775bdd787c90"

jobs:
  build-scan-push:
    name: Build, Scan & Push Docker Image
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Environment & Image Tags
        id: prep
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" == "main" ] || [ "${{ github.ref_name }}" == "master" ]; then
            ENV="prod"
          elif [ "${{ github.ref_name }}" == "int" ]; then
            ENV="int"
          else
            ENV="dev"
          fi
          
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "TARGET_ENV=$ENV" >> $GITHUB_ENV
          echo "FINAL_TAG=${ENV}-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ env.FINAL_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:latest \
            .

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ env.FINAL_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to ACR (with automatic IP whitelisting fallback)
        shell: bash
        run: |
          push_images() {
            docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:${{ env.FINAL_TAG }} && \
            docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVICE_NAME }}:latest
          }

          if ! push_images; then
            echo "::warning::Docker push failed. Attempting to whitelist runner IP address in ACR firewall rules..."
            RUNNER_IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me)
            echo "Runner Public IP: $RUNNER_IP"
            
            if [ -n "$RUNNER_IP" ]; then
              echo "Adding IP rule for $RUNNER_IP to ACR ${{ env.ACR_NAME }}..."
              az acr network-rule add --name ${{ env.ACR_NAME }} --ip-address "$RUNNER_IP"
              echo "Waiting 5 seconds for network rule propagation..."
              sleep 5
              
              echo "Retrying Docker push after whitelisting IP..."
              push_images
            else
              echo "Failed to determine runner public IP."
              exit 1
            fi
          fi
